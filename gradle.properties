# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# We no longer need to auto-convert third-party libraries to use AndroidX, which slowed down the build
android.enableJetifier=false

# Increased JVM heap to 4 GB and enabled G1GC for faster builds and reduced GC overhead
org.gradle.jvmargs=-Xmx4096M -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=50 -Dsun.io.useCanonCaches=true -Djava.net.preferIPv4Stack=true

# Enable parallel task execution across subprojects (:FtcRobotController, :TeamCode)
org.gradle.parallel=true

# Enable Gradle build cache to reuse task outputs across builds
org.gradle.caching=true

# Enable file system watching for fast incremental change detection
org.gradle.vfs.watch=true

android.nonTransitiveRClass=false